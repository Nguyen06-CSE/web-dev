<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 - background-position</title>
<style>

body { font-family: sans-serif; }
.box { width: 260px; height: 190px; border: 2px solid #333; margin: 8px; display: inline-block; vertical-align: top;
       background: #eef url(star.png) no-repeat; }
.box span { background: #fff; padding: 2px 6px; }
.p1 { background-position: left top; }
.p2 { background-position: right center; }
.p3 { background-position: center bottom; }
.p4 { background-position: left; }          /* = left center */
.p5 { background-position: 200px 50px; }
.p6 { background-position: 100% 100%; }
.p7 { background-position: 80%; }           /* = 80% 50% */
.p8 { background-position: 25% 75%; }

</style>
</head>
<body>
<h1>background-position</h1>
<div class="box p1"><span>left top</span></div>
<div class="box p2"><span>right center</span></div>
<div class="box p3"><span>center bottom</span></div>
<div class="box p4"><span>left (= left center)</span></div>
<div class="box p5"><span>200px 50px</span></div>
<div class="box p6"><span>100% 100%</span></div>
<div class="box p7"><span>80% (= 80% 50%)</span></div>
<div class="box p8"><span>25% 75%</span></div>
</body></html>

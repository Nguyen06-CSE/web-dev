<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 - linear-gradient</title>
<style>

body { font-family: sans-serif; }
p { width: 300px; height: 100px; padding: 20px; display: inline-block; margin: 8px; vertical-align: top; }
.l1 { background-image: linear-gradient(90deg, yellow, green); }
.l2 { background-image: linear-gradient(to right, yellow, green); }
.l3 { background-image: linear-gradient(to right, yellow, red 50%, green); }
.l4 { background-image: linear-gradient(to bottom, #e2e2e2 0%, #dbdbdb 50%, #d1d1d1 51%, #fefefe 100%); }
.l5 { background-image: linear-gradient(45deg, yellow, green); }
.l6 { background-image: repeating-linear-gradient(to bottom, white, silver 30px); }

</style>
</head>
<body>
<h1>linear-gradient</h1>
<p class="l1">90deg, yellow → green</p>
<p class="l2">to right, yellow → green</p>
<p class="l3">3 màu chặn, red ở 50%</p>
<p class="l4">Nền chuyển sắc 3-D</p>
<p class="l5">45deg</p>
<p class="l6">repeating-linear-gradient</p>
</body></html>

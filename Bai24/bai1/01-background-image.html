<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 - background-image</title>
<style>

body { background-color: lightblue; background-image: url(star.png); }
blockquote { background-image: url(dot.png); padding: 2em; border: 4px dashed; }

</style>
</head>
<body>
<h1>3.3.1 background-image</h1>
<blockquote>Ảnh nền star.png cho body, dot.png cho blockquote. Chú ý: màu nền dự phòng (background-color) luôn nằm dưới ảnh nền, và nền phủ cả vùng padding lẫn border.</blockquote>
</body></html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 - tương thích trình duyệt</title>
<style>

body { font-family: sans-serif; }
.grad { width: 300px; height: 100px; padding: 20px;
  background: #ffff00; /* Old browsers */
  background: -moz-linear-gradient(top, #ffff00 0%, #00ff00 100%);          /* FF3.6+ */
  background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#ffff00), color-stop(100%,#00ff00)); /* Chrome,Safari4+ */
  background: -webkit-linear-gradient(top, #ffff00 0%,#00ff00 100%);        /* Chrome10+,Safari5.1+ */
  background: -o-linear-gradient(top, #ffff00 0%,#00ff00 100%);             /* Opera 11.10+ */
  background: -ms-linear-gradient(top, #ffff00 0%,#00ff00 100%);            /* IE10+ */
  background: linear-gradient(to bottom, #ffff00 0%,#00ff00 100%);          /* W3C */
  filter: progid:DXImageTransform.Microsoft.gradient( startColorstr="#ffff00", endColorstr="#00ff00",GradientType=0 ); /* IE6-9 */
}

</style>
</head>
<body>
<h1>Tiếp đầu ngữ trình duyệt</h1>
<div class="grad">Nền chuyển sắc có prefix (-moz-, -webkit-, -o-, -ms-). Dòng chuẩn W3C đặt cuối cùng để được ưu tiên.</div>
<p>Công cụ sinh mã tự động: colorzilla.com/gradient-editor</p>
</body></html>

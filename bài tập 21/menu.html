<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Black Goose Bistro Summer Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Marko+One&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: Verdana, sans-serif;
      font-size: 100%;
    }
    h1 {
      font-family: "Marko One", Georgia, serif;
      font-size: 1.5em;
    }
    h2 {
      font-size: 1em;
    }

    /* 1. In nghiêng mọi chữ nhấn mạnh, nhưng chỉ tô màu tomato cho chữ trong tiêu đề món (dt) */
    strong {
      font-style: italic;
    }
    dt strong {
      color: tomato;
    }

    /* 2 & 3. Định dạng vùng thông tin đầu trang (#info) */
    #info {
      color: teal;
    }
    #info p {
      font-style: italic;
    }

    /* 4. Định dạng giá món ăn (.price) */
    .price {
      font-family: Georgia, serif;
      font-style: italic;
      color: gray;
    }

    /* 5. Định dạng nhãn giờ mở cửa (.label) */
    .label {
      font-weight: bold;
      font-variant: small-caps;
      font-style: normal;
    }

    /* 6. Định dạng đoạn cảnh báo và ký hiệu chú thích */
    p.warning, sup {
      font-size: small;
      color: red;
    }
  </style>
</head>
<!-- Phần <body> giữ nguyên như bài trước -->

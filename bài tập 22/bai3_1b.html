<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bài tập 3.1b - Google</title>
  <style>
    @font-face {
      font-family: "Product Sans";
      src: url('fonts/product-sans/Product Sans Bold.ttf');
    }

    p {
      font-family: "Product Sans", Arial, sans-serif;
      font-weight: bold;
      font-size: 90px;
      letter-spacing: -6px; /* Điều chỉnh độ khít giữa các chữ cái */
      text-align: center;
      margin-top: 100px;
    }

    .blue   { color: #4285f4; }
    .red    { color: #ea4335; }
    .yellow { color: #fbbc05; }
    .green  { color: #34a853; }
  </style>
</head>
<body>

  <!-- Viết liền các thẻ span để không sinh ra khoảng trắng thừa giữa các ký tự -->
  <p><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span></p>

</body>
</html>

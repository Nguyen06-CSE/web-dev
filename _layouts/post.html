---
layout: default
---
<article class="post">
  <header class="post-header" style="margin-bottom: 20px;">
    <h1 class="post-title" style="margin-bottom: 8px;">{{ page.title | escape }}</h1>
    <p class="post-meta" style="color: #666; font-size: 0.9em;">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        📅 {{ page.date | date: "%d/%m/%Y" }}
      </time>
      {% if page.author %}
        • 👤 {{ page.author }}
      {% endif %}
      {% if page.categories.size > 0 %}
        • 🏷️ {{ page.categories | join: ", " }}
      {% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

  <p>
    <a href="{{ '/' | relative_url }}">← Quay lại Trang chủ</a>
  </p>
</article>
